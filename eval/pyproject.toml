[project]
name = "eval"
version = "0.1.0"
description = "Black-box scenario suite for the prototype, tagged by requirement ID"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.8",
    "pytest>=9.1.1",
]

# Not a workspace member and not an installable package: it tests the running
# services over HTTP, reads core's database only for the audit checks and the
# "stored" claims, and never imports core or mismo.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scenarios"]
pythonpath = ["."]
addopts = ["--strict-markers"]

# Its own ruff section, so ruff doesn't use the workspace's (whose `src`
# would make `support` sort as third-party).
[tool.ruff]
src = ["."]
