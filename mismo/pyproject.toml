[project]
name = "mismo"
version = "0.1.0"
description = "MISMO v3.4 data model, mapper, and validation for the supported URLA subset"
readme = "README.md"
authors = [
    { name = "Justin Pallansch", email = "pallanschja@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "xsdata[cli,lxml]>=26.10",
    "pydantic-extra-types[phonenumbers]>=2.11.1",
    "pydantic[email]>=2.13.5",
    "lxml>=6.1.3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
