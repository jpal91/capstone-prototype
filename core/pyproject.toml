[project]
name = "core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Justin Pallansch", email = "pallanschja@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "sqlalchemy>=2.1.4",
    "mismo",
    "psycopg[binary]>=3.3.6",
]

[tool.uv.sources]
mismo = { workspace = true }

[project.scripts]
core = "core:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
