# docker compose up --build    # run (NFR-07)
# docker compose down -v       # remove everything, including the database
#
# Images built here contain the license-restricted MISMO schema and generated
# bindings: never push them to a registry. Ports are bound to 127.0.0.1
# because Docker's port publishing bypasses host firewalls such as ufw.

x-core-env: &core-env
  DATABASE_URL: postgresql+psycopg://core:core@db:5432/core

# Demo credentials for the synthetic accounts (NFR-06). They are public by
# design, so use them only for this local demo; override any of them from the
# shell or a .env file next to this one. Split so that each service gets only
# what it uses: seed needs all of them; mock-lender only its lenders' secrets.
x-borrower-credentials: &borrower-credentials
  ALICE_PASSWORD: ${ALICE_PASSWORD:-demo-labials-Reacted-pigmy-Prep-tanners-24!}
  BOB_PASSWORD: ${BOB_PASSWORD:-demo-loopy-Tycoons-irately-Unify-attic-38!}

# The lenders mock-lender acts for.
x-mock-lender-secrets: &mock-lender-secrets
  LENDER_A_SECRET: ${LENDER_A_SECRET:-demo-stories-Civilly-trachea-Filbert-chisels-53!}
  LENDER_B_SECRET: ${LENDER_B_SECRET:-demo-acquits-Tangelo-loam-Wide-droned-67!}

# Lender C has no mock lender; eval/ uses it as a lender with no grant.
x-lender-c-secret: &lender-c-secret
  LENDER_C_SECRET: ${LENDER_C_SECRET:-demo-gerunds-Mask-impure-Dowdily-tenting-55!}

x-core-build: &core-build
  context: .
  dockerfile: core/Dockerfile

services:
  db:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: core
    volumes:
      - ./mock-lender/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Creates the tables and the demo accounts, then exits. Same image as core.
  seed:
    build: *core-build
    command: ["core-seed"]
    environment:
      <<:
        [*core-env, *borrower-credentials, *mock-lender-secrets, *lender-c-secret]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  core:
    build: *core-build
    ports:
      - "127.0.0.1:8000:8000"
    environment: *core-env
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 2s
      timeout: 3s
      retries: 15

  # Borrower UI on http://localhost:3000. Calls core server-side only.
  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      CORE_URL: http://core:8000
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 15

  # Stands in for the lenders' own systems, on http://localhost:3001. Its own
  # database (lender, created by mock-lender/db/init.sql) and only its
  # lenders' credentials; it reaches core over HTTP like any lender (ADR 0003).
  mock-lender:
    build:
      context: .
      dockerfile: mock-lender/Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      <<: *mock-lender-secrets
      DATABASE_URL: postgres://lender:lender@db:5432/lender
      CORE_URL: http://core:8000
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 15
